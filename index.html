<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de PDF - SEMED</title>
<meta name="description" content="Editor de PDF online e seguro - Visualize, edite textos e preencha formulários diretamente no navegador.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z'/%3E%3Cpath d='M14 3v5h5M9 13h6M9 17h4'/%3E%3C/svg%3E">
<style>
:root{--bg:#f1f3f7;--sf:#fff;--tx:#111827;--mu:#6b7280;--ac:#4f46e5;--ac2:#eef0ff;--bd:#e3e6ee;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1018;--sf:#161c29;--tx:#e8eaf0;--mu:#98a2b3;--ac:#8b93ff;--ac2:#232a47;--bd:#283044}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1018;--sf:#161c29;--tx:#e8eaf0;--mu:#98a2b3;--ac:#8b93ff;--ac2:#232a47;--bd:#283044}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);box-shadow:var(--sh);padding:9px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:21}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;display:grid;place-items:center}
.logo svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:15px;font-weight:650;letter-spacing:-.01em;margin:0}
button,select,input[type=number]{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:9px;height:34px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s,box-shadow .15s}
select{padding-right:8px}
button:hover,select:hover{background:var(--ac2);border-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;border-radius:8px}
.seg button:hover{background:var(--sf)}
.seg button.on{background:var(--sf);color:var(--ac);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.14)}
.seg.sm button{width:30px;padding:0;justify-content:center;font-size:14px}
.seg.sm button.on{background:var(--ac);color:#fff}
.grp{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid var(--bd)}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(79,70,229,.35)}
button.pri:hover{background:var(--ac);filter:brightness(1.1)}
.nav-link-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;text-decoration:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);cursor:pointer;transition:.15s}
.nav-link-btn:hover{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=color]{width:34px;height:34px;border:1px solid var(--bd);border-radius:9px;padding:3px;background:var(--sf);cursor:pointer}
input[type=number]{width:64px;padding:0 8px}
.grow{flex:1}
#hint{display:flex;justify-content:center;padding:12px 14px 2px}
#hint:not([hidden])::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac);align-self:center;margin-right:8px}
#hint{align-items:center;color:var(--mu);font-size:13px}
#drop{margin:8vh auto;max-width:540px;border:2px dashed var(--bd);border-radius:22px;padding:56px 24px;text-align:center;background:var(--sf);box-shadow:var(--sh);transition:.2s}
#drop.over{border-color:var(--ac);background:var(--ac2)}
#drop h2{margin:14px 0 0;font-size:22px;letter-spacing:-.02em}
#drop p{color:var(--mu);margin:8px 0 22px}
#drop button{height:42px;padding:0 22px;font-size:15px;margin:auto}
.dz{width:64px;height:64px;border-radius:18px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;margin:auto}
.dz svg{width:30px;height:30px}
#pages{padding:6px 8px 90px;display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto}
.gap{height:38px;flex:none;display:flex;align-items:center;justify-content:center}
.gap button{height:26px;padding:0 12px;border:0;background:transparent;color:var(--mu);font-size:12.5px;border-radius:13px;opacity:.6}
.gap button:hover,.gap button:focus-visible{opacity:1;color:var(--ac);background:var(--ac2)}
.page{scroll-margin-top:70px;position:relative;background:#fff;border-radius:3px;box-shadow:0 1px 3px rgba(16,24,40,.12),0 12px 32px rgba(16,24,40,.16);flex:none;overflow:hidden}
.page canvas{display:block}
.tl,.an{position:absolute;inset:0}
.an{pointer-events:none;z-index:3}
.tl{z-index:2;pointer-events:none}
body.t-edit .tl{pointer-events:auto}
body.t-edit .hit{cursor:text}
body.t-text .page,body.t-erase .page{cursor:crosshair}
.hit{position:absolute;border-radius:3px;transition:background .12s}
body.t-edit .hit:hover{background:rgba(79,70,229,.12);outline:1.5px solid rgba(79,70,229,.7)}
.ann{position:absolute;pointer-events:auto}
.ann.cover{background:#fff}
.ann.sel{outline:1.5px solid var(--ac);outline-offset:2px;border-radius:2px}
.ann .ed{white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;outline:none;line-height:1.2;min-width:20px;min-height:1.2em;color:#000}
.tb{display:none;position:absolute;left:-2px;bottom:100%;margin-bottom:7px;gap:2px;background:#1f2430;border-radius:10px;padding:3px;z-index:9;box-shadow:0 6px 18px rgba(16,24,40,.3)}
.ann.top-edge .tb{bottom:auto;top:100%;margin-top:7px;margin-bottom:0}
.ann.sel .tb{display:flex}
.tb span{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;cursor:pointer;user-select:none;color:#e5e7eb}
.tb span:hover{background:rgba(255,255,255,.16)}
.tb .mv{cursor:grab;touch-action:none}
.rz{display:none;position:absolute;right:-8px;bottom:-8px;width:14px;height:14px;background:var(--ac);border:2.5px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:ew-resize;touch-action:none}
.ann.text.sel .rz{display:block}
.page-tools{position:absolute;top:10px;right:10px;z-index:10;display:flex;flex-direction:column;gap:3px;background:none;border:none;box-shadow:none;padding:0}
.pt-btn{width:28px;height:28px;padding:0;border:0;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#374151;cursor:pointer;transition:background .15s,color .15s,opacity .15s}
.pt-btn svg{width:16px;height:16px}
.pt-btn:hover:not(:disabled){background:rgba(79,70,229,.1);color:#4f46e5}
.pt-btn.pt-del:hover:not(:disabled){background:rgba(220,38,38,.12);color:#dc2626}
.pt-btn:disabled{opacity:.2;cursor:not-allowed}
.page-body{position:relative;width:100%;height:100%;transform-origin:top left;transition:transform .2s cubic-bezier(.2,0,0,1)}
.page.page-dragging{opacity:.45}
.page.page-drop-before{box-shadow:0 -4px 0 0 var(--ac),var(--sh)}
.page.page-drop-after{box-shadow:0 4px 0 0 var(--ac),var(--sh)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:#1f2430;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(16,24,40,.3);opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){.lb{display:none}.grp{border-left:0;padding-left:0}}
.pop{position:relative}
#spPanel{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:262px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:12px;display:grid;gap:6px}
#spPanel label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}
#spPanel .row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
#spPanel .row button{width:30px;padding:0;justify-content:center}
#spPanel input[type=range]{flex:1;min-width:0;padding:0;border:0;height:24px;accent-color:var(--ac)}
</style>
</head>
<body class="t-edit">
<header id="bar" hidden>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></span><h1>Editor de PDF</h1></div>
  <div class="seg" role="group" aria-label="Ferramentas">
    <button data-t="edit" class="on" title="Clique em um texto do PDF para editá-lo"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg><span class="lb">Editar texto</span></button>
    <button data-t="text" title="Clique na página para escrever"><svg class="i" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg><span class="lb">Novo texto</span></button>
    <button data-t="erase" title="Arraste para cobrir uma área"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/></svg><span class="lb">Apagar área</span></button>
  </div>
  <div class="seg sm" role="group" aria-label="Histórico">
    <button id="bUndo" title="Desfazer (Ctrl+Z)" disabled><svg class="i" viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 0 1 5 5v2m-15-7l4-4m-4 4l4 4"/></svg></button>
    <button id="bRedo" title="Refazer (Ctrl+Y)" disabled><svg class="i" viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 0 0-5 5v2m15-7l-4-4m4 4l-4 4"/></svg></button>
  </div>
  <div class="grp">
    <select id="font" title="Fonte"><option>Helvetica</option><option>Times</option><option>Courier</option></select>
    <input type="number" id="size" min="6" max="120" value="14" title="Tamanho">
    <input type="color" id="color" value="#000000" title="Cor">
    <div class="seg sm"><button id="bB" title="Negrito"><b>B</b></button><button id="bI" title="Itálico"><i>I</i></button><button id="bU" title="Sublinhado"><u>U</u></button></div>
    <button id="bJ" title="Une as linhas do parágrafo para o texto quebrar sozinho conforme a largura da caixa"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h9"/></svg><span class="lb">Unir linhas</span></button>
    <div class="pop" id="spWrap">
      <button id="bSp" title="Espaçamento entre letras e entre linhas"><svg class="i" viewBox="0 0 24 24"><path d="M3 5v14M21 5v14M7 12h10M7 12l3-3M7 12l3 3M17 12l-3-3M17 12l-3 3"/></svg><span class="lb">Espaçamento</span></button>
      <div id="spPanel" hidden>
        <label>Entre letras <output id="lsV">0.0 pt</output></label>
        <div class="row"><button id="lsM" title="Diminuir">−</button><input type="range" id="ls" min="-2" max="10" step="0.1" value="0"><button id="lsP" title="Aumentar">+</button></div>
        <label>Entre linhas <output id="lhV">×1.20</output></label>
        <div class="row"><button id="lhM" title="Diminuir">−</button><input type="range" id="lh" min="0.8" max="3" step="0.05" value="1.2"><button id="lhP" title="Aumentar">+</button></div>
        <button id="spR">Redefinir</button>
      </div>
    </div>
  </div>
  <span class="grow"></span>
  <a href="converter.html" class="nav-link-btn" title="Ir para o Conversor de Arquivos"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg><span class="lb">Conversor</span></a>
  <button id="open"><svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span class="lb">Abrir outro</span></button>
  <button id="save" class="pri"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>Salvar PDF</button>
</header>
<div id="hint" hidden></div>
<div id="drop">
  <div class="dz"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg></div>
  <h2>Abra um PDF para editar</h2>
  <p>Arraste o arquivo aqui ou escolha no seu aparelho.<br>Tudo acontece no seu navegador, nada é enviado.</p>
  <button class="pri" id="pick">Escolher PDF</button>
  <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:6px">
    <span style="font-size:13px;color:var(--mu)">Precisa converter documentos?</span>
    <a href="converter.html" style="font-size:13px;font-weight:600;color:var(--ac);text-decoration:none">Acessar Conversor ➔</a>
  </div>
</div>
<div id="pages"></div>
<input type="file" id="file" accept="application/pdf" hidden>
<input type="file" id="addfile" accept="application/pdf" hidden>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const S = 1.5, FONTS = {Helvetica:'Arial,Helvetica,sans-serif', Times:'"Times New Roman",Times,serif', Courier:'"Courier New",monospace'};
const $ = id => document.getElementById(id);
let bytes, fileName = 'documento.pdf', anns = [], pgs = [], tool = 'edit', sel = null, nid = 1;
let srcs = [], pinfo = {}, pidN = 0, addAfter = null;   // srcs: PDFs de origem; pinfo: página -> {origem, nº da página}
let undoStack = [], redoStack = [], draggedWrap = null;
try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) {}

const HINTS = {
  edit: 'Clique em qualquer texto do PDF para editá-lo.',
  text: 'Clique na página no lugar onde quer escrever.',
  erase: 'Arraste na página para cobrir uma área com branco.'
};
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- histórico: desfazer / refazer ---------- */
function recordAction(act) {
  undoStack.push(act);
  redoStack.length = 0;
  updateHistoryButtons();
}
function updateHistoryButtons() {
  const u = $('bUndo'), r = $('bRedo');
  if (u) u.disabled = undoStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}
function undo() {
  if (!undoStack.length) return toast('Nada para desfazer.');
  const act = undoStack.pop();
  if (act.type === 'add_ann') {
    removeAnn(act.ann, false);
  } else if (act.type === 'edit_hit') {
    act.hit.style.display = '';
    act.cover.el.remove();
    act.text.el.remove();
    anns = anns.filter(x => x !== act.cover && x !== act.text);
    if (sel === act.text) sel = null;
  } else if (act.type === 'remove_ann') {
    anns.push(act.ann);
    pgs[act.ann.page].an.append(act.ann.el);
    place(act.ann); style(act.ann);
    if (act.cover) {
      anns.push(act.cover);
      pgs[act.cover.page].an.append(act.cover.el);
      place(act.cover);
    }
    if (act.hit) act.hit.style.display = 'none';
    select_(act.ann);
  } else if (act.type === 'move_page') {
    const ws = [...document.querySelectorAll('#pages .page')].filter(w => w !== act.wrap);
    if (act.fromIdx >= ws.length) {
      ws[ws.length - 1].after(act.wrap);
    } else {
      ws[act.fromIdx].before(act.wrap);
    }
    refreshGaps();
    act.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (act.type === 'rotate_page') {
    applyPageRotation(act.wrap, -act.delta);
  } else if (act.type === 'delete_page') {
    const ws = [...document.querySelectorAll('#pages .page')];
    if (act.idx >= ws.length) {
      $('#pages').append(act.wrap);
    } else {
      ws[act.idx].before(act.wrap);
    }
    act.removedAnns.forEach(a => {
      anns.push(a);
      pgs[a.page].an.append(a.el);
    });
    refreshGaps();
    act.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  redoStack.push(act);
  updateHistoryButtons();
  toast('Alteração desfeita.');
}
function redo() {
  if (!redoStack.length) return toast('Nada para refazer.');
  const act = redoStack.pop();
  if (act.type === 'add_ann') {
    anns.push(act.ann);
    pgs[act.ann.page].an.append(act.ann.el);
    place(act.ann); style(act.ann);
    select_(act.ann);
  } else if (act.type === 'edit_hit') {
    act.hit.style.display = 'none';
    anns.push(act.cover); pgs[act.cover.page].an.append(act.cover.el); place(act.cover);
    anns.push(act.text); pgs[act.text.page].an.append(act.text.el); place(act.text); style(act.text);
    select_(act.text);
  } else if (act.type === 'remove_ann') {
    removeAnn(act.ann, false);
  } else if (act.type === 'move_page') {
    const ws = [...document.querySelectorAll('#pages .page')];
    const filtered = ws.filter(w => w !== act.wrap);
    if (act.toIdx >= filtered.length) {
      filtered[filtered.length - 1].after(act.wrap);
    } else {
      filtered[act.toIdx].before(act.wrap);
    }
    refreshGaps();
    act.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else if (act.type === 'rotate_page') {
    applyPageRotation(act.wrap, act.delta);
  } else if (act.type === 'delete_page') {
    anns = anns.filter(a => a.page !== act.wrap._pid);
    act.wrap.remove();
    refreshGaps();
  }
  undoStack.push(act);
  updateHistoryButtons();
  toast('Alteração refeita.');
}
$('bUndo').onclick = undo;
$('bRedo').onclick = redo;

function setTool(t) {
  tool = t; document.body.className = 't-' + t;
  document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('hint').textContent = HINTS[t];
}
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setTool(b.dataset.t));

/* ---------- abrir ---------- */
$('pick').onclick = $('open').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && openFile(e.target.files[0]);
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); const f = e.dataTransfer.files[0]; if (f && /pdf/i.test(f.type + f.name)) openFile(f); });

async function openFile(f) {
  try {
    fileName = f.name; bytes = new Uint8Array(await f.arrayBuffer());
    const doc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
    anns = []; pgs = []; sel = null; $('pages').innerHTML = ''; srcs = [bytes]; pinfo = {}; pidN = 0;
    undoStack.length = 0; redoStack.length = 0; updateHistoryButtons();
    $('drop').hidden = true; $('bar').hidden = false; $('hint').hidden = false; setTool('edit');
    await addPages(doc, 0, w => $('pages').append(w));
    refreshGaps();
    updatePageTools();
  } catch (err) { toast('Não foi possível abrir este PDF.'); console.error(err); }
}

async function addPages(doc, src, ins) {
  const ids = [];
  for (let n = 1; n <= doc.numPages; n++) { const pid = pidN++; ids.push(pid); await renderPage(await doc.getPage(n), pid, ins, src, n - 1); }
  return ids;
}

/* ---------- adicionar novo documento entre páginas ---------- */
function refreshGaps() {
  document.querySelectorAll('#pages .gap').forEach(g => g.remove());
  const mkGap = after => {
    const g = document.createElement('div'); g.className = 'gap';
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '+ Adicionar novo documento';
    b.title = 'Insere outro PDF neste ponto';

function movePage(wrap, dir, record = true) {
  const ws = [...document.querySelectorAll('#pages .page')];
  const idx = ws.indexOf(wrap);
  if (idx === -1) return;
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= ws.length) return;
  if (record) {
    recordAction({ type: 'move_page', wrap, fromIdx: idx, toIdx: targetIdx });
  }
  if (dir < 0) {
    ws[targetIdx].before(wrap);
  } else {
    ws[targetIdx].after(wrap);
  }

  wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast(dir < 0 ? 'Página movida para cima.' : 'Página movida para baixo.');
}

function applyPageRotation(wrap, delta) {
  wrap._rot = ((wrap._rot || 0) + delta) % 360;
  if (wrap._rot < 0) wrap._rot += 360;
  const body = wrap.querySelector('.page-body');
  const w = wrap._origW, h = wrap._origH;

    wrap.style.width = h + 'px';
    wrap.style.height = w + 'px';
    if (body) body.style.transform = `translate(${h}px, 0px) rotate(90deg)`;
  } else if (wrap._rot === 180) {
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
    if (body) body.style.transform = `translate(${w}px, ${h}px) rotate(180deg)`;
  } else if (wrap._rot === 270) {
    wrap.style.width = h + 'px';
    wrap.style.height = w + 'px';
    if (body) body.style.transform = `translate(0px, ${w}px) rotate(270deg)`;
  } else {
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
    if (body) body.style.transform = 'none';
  }
}

function rotatePage(wrap, delta = 90, record = true) {
  if (record) {
    recordAction({ type: 'rotate_page', wrap, delta });
  }
  applyPageRotation(wrap, delta);
  toast(`Página girada em ${delta}°.`);
}

function deletePage(wrap, record = true) {
  const ws = [...document.querySelectorAll('#pages .page')];
  if (ws.length <= 1) return toast('O documento precisa ter pelo menos uma página.');
  if (!confirm('Deseja realmente excluir esta página?')) return;
  const idx = ws.indexOf(wrap);
  const pid = wrap._pid;
  const removedAnns = anns.filter(a => a.page === pid);
  if (record) {
    recordAction({ type: 'delete_page', wrap, idx, removedAnns });
  }
  anns = anns.filter(a => {
    if (a.page === pid) { if (a.el) a.el.remove(); return false; }
    return true;
  });
  if (sel && sel.page === pid) sel = null;
  wrap.remove();
  refreshGaps();
  toast('Página excluída.');
}

function updatePageTools() {
  const ws = [...document.querySelectorAll('#pages .page')];
  ws.forEach((w, i) => {
    const up = w.querySelector('.pt-up'), down = w.querySelector('.pt-down'), del = w.querySelector('.pt-del');
    if (up) up.disabled = (i === 0);
    if (down) down.disabled = (i === ws.length - 1);
    if (del) del.disabled = (ws.length <= 1);

}

        wrap.removeEventListener('pointermove', mv); wrap.removeEventListener('pointerup', up); box.remove();
        if (box._r && box._r.w > 3 && box._r.h > 3) {
          const a = addAnn({ type: 'cover', page: idx, ...box._r }, true);
          recordAction({ type: 'add_ann', ann: a });
        }
      };
      wrap.addEventListener('pointermove', mv); wrap.addEventListener('pointerup', up);
    }
  });
}

function getPageBounds(pageIdx) {
  const p = pgs[pageIdx];
  const w = (p && p.wrap && p.wrap._origW) ? (p.wrap._origW / S) : 595.28;
  const h = (p && p.wrap && p.wrap._origH) ? (p.wrap._origH / S) : 841.89;
  return { w, h };
}

/* ---------- anotações ---------- */
function addAnn(a, select) {
  a.id = nid++; anns.push(a);
  const el = document.createElement('div'); el.className = 'ann ' + a.type; a.el = el;
  const tb = document.createElement('div'); tb.className = 'tb';
  const ic = d => `<svg class="i" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
  const mv = document.createElement('span'); mv.className = 'mv'; mv.innerHTML = ic('M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20'); mv.title = 'Mover';
  const del = document.createElement('span'); del.innerHTML = ic('M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3'); del.title = 'Remover';
  tb.append(mv, del); el.append(tb);
  if (a.type === 'text') {
    const ed = document.createElement('div'); ed.className = 'ed'; ed.contentEditable = 'true'; ed.spellcheck = false;
    if (a.runs) { a.runs.forEach(r => ed.append(mk(r))); a.text = ed.innerText.replace(/\n$/, ''); } else ed.textContent = a.text;
    a.ed = ed; el.append(ed);
    ed.oninput = () => { a.text = ed.innerText.replace(/\n$/, ''); };
    ed.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); };
    ed.onfocus = () => select_(a);
    el.style.zIndex = 2;
    const rz = document.createElement('span'); rz.className = 'rz'; rz.title = 'Arraste para ajustar a largura da caixa'; el.append(rz);
    rz.onpointerdown = e => {
      e.stopPropagation(); e.preventDefault(); select_(a); rz.setPointerCapture(e.pointerId);
      const sx = e.clientX, w0 = ed.offsetWidth / S;
      rz.onpointermove = ev => {
        const bounds = getPageBounds(a.page);
        const maxW = Math.max(30, bounds.w - a.x - 12);
        a.w = Math.min(maxW, Math.max(30, w0 + (ev.clientX - sx) / S));
        style(a);
      };
      rz.onpointerup = () => { rz.onpointermove = rz.onpointerup = null; };
    };
  } else el.style.zIndex = 1;
  el.onpointerdown = e => { e.stopPropagation(); select_(a); };
  del.onclick = () => removeAnn(a);
  mv.onpointerdown = e => {
    e.stopPropagation(); e.preventDefault(); select_(a); mv.setPointerCapture(e.pointerId);
    const sx = e.clientX, sy = e.clientY, ox = a.x, oy = a.y;
    mv.onpointermove = ev => {
      const bounds = getPageBounds(a.page);
      a.x = Math.max(0, Math.min(bounds.w - 20, ox + (ev.clientX - sx) / S));
      a.y = Math.max(0, Math.min(bounds.h - 15, oy + (ev.clientY - sy) / S));

    };
    mv.onpointerup = () => { mv.onpointermove = mv.onpointerup = null; };
  };
  pgs[a.page].an.append(el); place(a); style(a);
  if (select) select_(a);
  return a;
}
function place(a) {
  const bounds = getPageBounds(a.page);
  a.x = Math.max(0, Math.min(bounds.w - 15, a.x));
  a.y = Math.max(0, Math.min(bounds.h - 15, a.y));
  const s = a.el.style; s.left = a.x * S + 'px'; s.top = a.y * S + 'px';
  if (a.y < 35) a.el.classList.add('top-edge'); else a.el.classList.remove('top-edge');
  if (a.type === 'cover') {
    a.w = Math.min(a.w, bounds.w - a.x);
    a.h = Math.min(a.h, bounds.h - a.y);
    s.width = a.w * S + 'px'; s.height = a.h * S + 'px';

}
function style(a) {

  Object.assign(a.ed.style, {
    fontSize: a.size * S + 'px', color: a.color, fontFamily: FONTS[a.font], lineHeight: a.lh || 1.2, letterSpacing: (a.ls || 0) * S + 'px',
    fontWeight: a.b ? '700' : '400', fontStyle: a.i ? 'italic' : 'normal', textDecoration: a.u ? 'underline' : 'none',
    whiteSpace: 'pre-wrap', width: a.w ? a.w * S + 'px' : '', maxWidth: (maxW * S) + 'px', overflowWrap: 'break-word', wordBreak: 'break-word'

}
function select_(a) {

  if (a.type === 'text') { $('size').value = a.size; $('color').value = a.color; $('font').value = a.font; }
  sync(); spSync();
}
function removeAnn(a, record = true) {
  if (record) {
    recordAction({ type: 'remove_ann', ann: a, cover: a.cover, hit: a.hit });
  }
  a.el.remove(); anns = anns.filter(x => x !== a); if (sel === a) sel = null;
  if (a.cover) {
    a.cover.el.remove();
    anns = anns.filter(x => x !== a.cover);
  }

}
function focusEd(a, all) {
  a.ed.focus();
  const r = document.createRange(); r.selectNodeContents(a.ed); if (!all) r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
addEventListener('pointerdown', e => { if (!e.target.closest('#spWrap')) $('spPanel').hidden = true; if (!e.target.closest('.ann, header') && sel) { sel.el.classList.remove('sel'); sel = null; } });
addEventListener('keydown', e => {
  const isCtrl = e.ctrlKey || e.metaKey;
  if (isCtrl && !e.altKey) {
    if (e.key === 'z' || e.key === 'Z') {
      const inEd = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('ed');
      if (e.shiftKey) {
        e.preventDefault();
        redo();
      } else if (!inEd) {
        e.preventDefault();
        undo();
      }
    } else if (e.key === 'y' || e.key === 'Y') {
      const inEd = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('ed');
      if (!inEd) {
        e.preventDefault();
        redo();
      }
    }
  }
  if ((e.key === 'Delete') && sel && document.activeElement !== sel.ed) removeAnn(sel);
});

['size', 'color', 'font'].forEach(id => $(id).oninput = () => {
  if (sel && sel.type === 'text') { sel.size = +$('size').value || sel.size; sel.color = $('color').value; sel.font = $('font').value; style(sel); }
});

function sync() {
  const s = getSelection(), ok = sel && sel.type === 'text' && s.rangeCount && sel.ed.contains(s.anchorNode);
  [['bB', 'bold'], ['bI', 'italic'], ['bU', 'underline']].forEach(([id, c]) => $(id).classList.toggle('on', !!ok && document.queryCommandState(c)));
}
document.addEventListener('selectionchange', sync);
// lê o conteúdo da caixa como linhas de trechos com estilo {s,b,i,u}
function runsLines(root) {
  const lines = [[]]; let started = false; const nl = () => lines.push([]);
  (function walk(n, st) {
    for (const c of n.childNodes) {
      if (c.nodeType === 3) {
        c.nodeValue.split('\n').forEach((p, k) => { if (k) nl(); if (p) lines[lines.length - 1].push({ s: p, ...st }); });
        started = true;
      } else if (c.nodeType === 1) {
        const t = c.tagName, cs = c.style;
        if (t === 'BR') { if (!(c.parentNode !== root && c.parentNode.childNodes.length === 1)) nl(); started = true; continue; }
        const s2 = { b: st.b || t === 'B' || t === 'STRONG' || /bold|[6-9]00/.test(cs.fontWeight), i: st.i || t === 'I' || t === 'EM' || cs.fontStyle === 'italic', u: st.u || t === 'U' || /underline/.test(cs.textDecorationLine + cs.textDecoration) };

function mk(r) {
  let n = document.createTextNode(r.s);
  for (const [f, tag] of [['u', 'u'], ['i', 'i'], ['b', 'b']]) if (r[f]) { const e = document.createElement(tag); e.append(n); n = e; }
  return n;
}
function fmt(cmd) {
  if (!sel || sel.type !== 'text') return toast('Selecione uma caixa de texto primeiro.');
  const s = getSelection();
  if (!(s.rangeCount && !s.isCollapsed && sel.ed.contains(s.anchorNode) && sel.ed.contains(s.focusNode))) {
    sel.ed.focus(); s.selectAllChildren(sel.ed); toast('Nenhum trecho selecionado: aplicado à caixa toda.');
  }
  document.execCommand('styleWithCSS', false, false);
  document.execCommand(cmd);
  sel.text = sel.ed.innerText.replace(/\n$/, ''); sync();
}
[['bB', 'bold'], ['bI', 'italic'], ['bU', 'underline']].forEach(([id, c]) => {
  $(id).onmousedown = e => e.preventDefault();   // mantém o trecho selecionado
  $(id).onclick = () => fmt(c);
});
$('bJ').onmousedown = e => e.preventDefault();
$('bJ').onclick = () => {
  if (!sel || sel.type !== 'text') return toast('Selecione uma caixa de texto primeiro.');
  if (!sel.w) sel.w = sel.ed.offsetWidth / S;
  const out = []; let cur = null;
  for (const l of runsLines(sel.ed)) {
    if (!l.map(r => r.s).join('').trim()) { if (cur) { out.push(cur); cur = null; } out.push([]); }
    else if (cur) cur.push({ s: ' ' }, ...l.map((r, k) => k ? r : { ...r, s: r.s.trimStart() }));
    else cur = l.slice();
  }
  if (cur) out.push(cur);
  sel.ed.textContent = '';
  out.forEach((l, k) => { if (k) sel.ed.append('\n'); l.forEach(r => sel.ed.append(mk(r))); });
  sel.text = sel.ed.innerText; style(sel);
  toast('Linhas unidas. Arraste o quadradinho azul para ajustar a largura.');
};

/* ---------- espaçamento entre letras e linhas ---------- */
const isT = () => sel && sel.type === 'text';
function spSync() {
  const ls = isT() ? (sel.ls || 0) : 0, lh = isT() ? (sel.lh || 1.2) : 1.2;
  $('ls').value = ls; $('lh').value = lh;
  $('lsV').textContent = ls.toFixed(1) + ' pt'; $('lhV').textContent = '×' + lh.toFixed(2);
}
function setLs(v) {
  if (!isT()) return;
  sel.ls = Math.min(10, Math.max(-2, Math.round(v * 10) / 10)); style(sel); spSync();
}
function setLh(v) {
  if (!isT()) return;
  v = Math.min(3, Math.max(.8, Math.round(v * 100) / 100));
  const old = sel.lh || 1.2;
  sel.y += sel.size * (old - v) / 2;      // mantém a 1ª linha no mesmo lugar
  sel.lh = v; place(sel); style(sel); spSync();
}
$('bSp').onclick = () => {
  if (!isT()) return toast('Selecione uma caixa de texto primeiro.');
  const h = $('spPanel'); h.hidden = !h.hidden; spSync();
};
$('ls').oninput = e => setLs(+e.target.value);
$('lh').oninput = e => setLh(+e.target.value);
$('lsM').onclick = () => isT() && setLs((sel.ls || 0) - .1);
$('lsP').onclick = () => isT() && setLs((sel.ls || 0) + .1);
$('lhM').onclick = () => isT() && setLh((sel.lh || 1.2) - .05);
$('lhP').onclick = () => isT() && setLh((sel.lh || 1.2) + .05);
$('spR').onclick = () => { setLs(0); setLh(1.2); };

/* ---------- salvar ---------- */
const hex = h => { const n = parseInt(h.slice(1), 16); return PDFLib.rgb((n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255); };
/* converte para caracteres suportados pelas fontes padrão do PDF (WinAnsi) */
const WA = {'\u2013':'\u2013','\u2014':'\u2014','\u2018':'\u2018','\u2019':'\u2019','\u201A':'\u201A','\u201C':'\u201C','\u201D':'\u201D','\u201E':'\u201E','\u2022':'\u2022','\u2026':'\u2026','\u20AC':'\u20AC','\u2122':'\u2122','\u2020':'\u2020','\u2021':'\u2021','\u2030':'\u2030','\u2039':'\u2039','\u203A':'\u203A','\u0152':'\u0152','\u0153':'\u0153','\u0160':'\u0160','\u0161':'\u0161','\u0178':'\u0178','\u017D':'\u017D','\u017E':'\u017E','\u0192':'\u0192','\u02C6':'\u02C6','\u02DC':'\u02DC'};
const WA_FIX = {'\u2212':'-','\u2010':'-','\u2011':'-','\u2012':'-','\u2015':'\u2014','\u00AD':'-','\u2002':' ','\u2003':' ','\u2009':' ','\u200B':'','\uFEFF':'','\u2192':'->','\u2190':'<-','\u2713':'x','\u2714':'x','\u2611':'x','\u2612':'x','\u2715':'x'};
const BOX = new Set(['\u2610','\u25A1','\u25FB','\uF06F','\uF071','\uF0A8']), BOXM = '\u00A0\u00A0\u00A0';   // caixas de marcar: desenhadas como quadrado
const winAnsi = t => Array.from(t).map(ch => BOX.has(ch) ? BOXM : (ch in WA_FIX) ? WA_FIX[ch] : (/[\x20-\x7E\xA0-\xFF]/.test(ch) || ch in WA) ? ch : '?').join('');
$('save').onclick = async () => {
  const btn = $('save'); btn.disabled = true;
  try {
    const { PDFDocument, rgb, StandardFonts } = PDFLib;
    const ws = [...document.querySelectorAll('#pages .page')], pages = {};
    if (!ws.length) return toast('Nenhuma página para salvar.');
    let doc;
    const docOrig = await PDFDocument.load(srcs[0]);
    const isUntouched = (srcs.length === 1) && (ws.length === docOrig.getPageCount()) && ws.every((w, i) => pinfo[w._pid].src === 0 && pinfo[w._pid].n === i && !w._rot);
    if (isUntouched) {            // um só documento e ordem intacta: mantém o PDF original intacto
      doc = docOrig; const pl = doc.getPages();
      ws.forEach(w => pages[w._pid] = pl[pinfo[w._pid].n]);
    } else {                            // páginas reordenadas, excluídas, giradas ou múltiplos arquivos: reconstrói na ordem da tela
      doc = await PDFDocument.create();
      const loadedSrcs = {};
      for (const w of ws) {
        const q = pinfo[w._pid];
        if (!loadedSrcs[q.src]) loadedSrcs[q.src] = await PDFDocument.load(srcs[q.src]);
      }
      for (const w of ws) {
        const q = pinfo[w._pid];
        const [cp] = await doc.copyPages(loadedSrcs[q.src], [q.n]);
        if (w._rot) {
          const curRot = cp.getRotation().angle;
          cp.setRotation(PDFLib.degrees((curRot + w._rot) % 360));
        }
        pages[w._pid] = doc.addPage(cp);
      }
    }
    const FN = { Helvetica: ['Helvetica', 'HelveticaBold', 'HelveticaOblique', 'HelveticaBoldOblique'], Times: ['TimesRoman', 'TimesRomanBold', 'TimesRomanItalic', 'TimesRomanBoldItalic'], Courier: ['Courier', 'CourierBold', 'CourierOblique', 'CourierBoldOblique'] };
    const F = {};
    for (const a of anns) if (a.type === 'text') for (let k = 0; k < 4; k++) if (!F[a.font + k]) F[a.font + k] = await doc.embedFont(StandardFonts[FN[a.font][k]]);
    for (const a of anns) if (a.type === 'cover') {
      const pg = pages[a.page], H = pg.getHeight();
      // marcador invisível com a posição da cobertura: ao reabrir, o texto antigo escondido embaixo é ignorado
      let mk0 = null, mk1 = null;
      try { mk0 = PDFLib.beginMarkedContent('EDC_' + [a.x, a.y, a.w, a.h].map(v => Math.round(v * 10) / 10).join('_')); mk1 = PDFLib.endMarkedContent(); } catch (e) {}
      if (mk0 && mk1) pg.pushOperators(mk0);
      pg.drawRectangle({ x: a.x, y: H - a.y - a.h, width: a.w, height: a.h, color: rgb(1, 1, 1) });
      if (mk0 && mk1) pg.pushOperators(mk1);
    }
    for (const a of anns) if (a.type === 'text') {
      const pg = pages[a.page], H = pg.getHeight();
      const lh = a.lh || 1.2, rows = [], fo = r => F[a.font + ((r.b ? 1 : 0) + (r.i ? 2 : 0))];
      const ls = a.ls || 0, TW = (f, t) => f.widthOfTextAtSize(t, a.size) + ls * Array.from(t).length;

      for (const line of runsLines(a.ed)) {

          if (!p0) continue;
          let rest = p0; const f0 = fo(r);
          while (TW(f0, rest.trimEnd()) > effectiveW && rest.trimEnd().length > 1) {
            let n = rest.trimEnd().length - 1;
            while (n > 1 && TW(f0, rest.slice(0, n)) > effectiveW) n--;
            pieces.push([r, rest.slice(0, n)]); rest = rest.slice(n);
          }
          pieces.push([r, rest]);
        }
        for (const [r, p] of pieces) {
          const t = { ...r, s: p }, f = fo(t), tw = TW(f, p.trimEnd());
          if (cur.length && wd + tw > effectiveW) { rows.push(cur); cur = []; wd = 0; }
          cur.push(t); wd += TW(f, p);

        rows.push(cur);

        const y = H - a.y - a.size * (lh / 2 + .35 + i * lh), c = hex(a.color); let x = a.x;

          const s = k === row.length - 1 ? r.s.trimEnd() : r.s; if (!s) return;

            if (!ls) { pg.drawText(str, { x: px, y, size: a.size, font: f, color: c }); px += f.widthOfTextAtSize(str, a.size); return; }
            for (const ch of Array.from(str)) { if (ch !== ' ') pg.drawText(ch, { x: px, y, size: a.size, font: f, color: c }); px += TW(f, ch); }
          };
          s.split(BOXM).forEach((part, j, arr) => {
            if (part) put(part);
            if (j < arr.length - 1) {   // quadradinho vazio no lugar de ☐
              const q = a.size * .7;
              pg.drawRectangle({ x: px + a.size * .07, y: y - a.size * .06, width: q, height: q, borderColor: c, borderWidth: Math.max(.6, a.size * .055) });

            }

          if (r.u) pg.drawLine({ start: { x, y: y - a.size * .12 }, end: { x: x + w, y: y - a.size * .12 }, thickness: Math.max(.5, a.size * .06), color: c });

    const name = fileName.replace(/\.pdf$/i, '') + '-editado.pdf';
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
    if (dl) await dl.save({ filename: name, data: out });
    else {   // download normal do navegador (funciona ao abrir o arquivo direto no computador)
      const url = URL.createObjectURL(new Blob([out], { type: 'application/pdf' }));
      const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    toast('PDF pronto!');
  } catch (err) {
    if (err && err.code === 'declined') toast('Salvamento cancelado.');
    else { toast('Erro ao salvar o PDF.'); console.error(err); }
  } finally { btn.disabled = false; }
};
</script>
